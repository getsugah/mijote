name: mijote
services:
  mijote:
    build: .
    image: mijote:0.5.0
    ports:
      - "${MIJOTE_BIND:-127.0.0.1}:${MIJOTE_PORT:-8080}:8000"
    environment:
      MIJOTE_SECURE_COOKIE: "${MIJOTE_SECURE_COOKIE:-false}"
      MIJOTE_ALLOWED_ORIGINS: "${MIJOTE_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
    volumes:
      - mijote_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  mijote_data:
